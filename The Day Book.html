<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Day Book</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--coal:#0f0d0b;--smoke:#1c1713;--gold:#c9a24a;--gold2:#f0d78c;--brass:#8a6b2a;--tele:#eadcb8;--blood:#8a2424;--ink:#2a2016;
--disp:'Limelight','Playfair Display',Georgia,serif;--type:'Special Elite','Courier New',monospace;--serif:'IM Fell English',Georgia,serif;--spring:cubic-bezier(.34,1.5,.64,1);--ease:cubic-bezier(.2,.8,.2,1);
--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8 0 0 0 0 .65 0 0 0 0 .4 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--coal:#0f0d0b}}
:root[data-theme="dark"]{--coal:#0f0d0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a2c1b,var(--coal) 62%) fixed,var(--coal);color:var(--tele);font-family:var(--serif);font-size:17px;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:var(--grain),repeating-linear-gradient(135deg,#ffffff04 0 2px,transparent 2px 14px);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 14px 130px}
.crest{display:block;width:100%;margin-top:8px}
.crest .r,.crest .a{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.2s var(--ease) forwards;animation-delay:calc(var(--n)*55ms + 150ms)}
.crest .a{stroke-dasharray:420;stroke-dashoffset:420}
.crest .sun{fill:var(--gold);transform-origin:200px 108px;animation:rise .9s var(--spring) .1s backwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{transform:scale(0);opacity:0}}
h1{font-family:var(--disp);font-weight:400;font-size:2.1rem;text-align:center;margin:-4px 0 0;line-height:1.1;letter-spacing:.06em;color:var(--gold);background:linear-gradient(#f6e3a4,#c9a24a 55%,#8a6b2a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:fade .9s var(--ease) .5s backwards;filter:drop-shadow(0 2px 3px #000)}
.tag{text-align:center;font-style:italic;color:var(--brass);margin:2px 0 14px;font-size:.95rem;animation:fade .9s var(--ease) .7s backwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.plate{position:relative;margin:6px 4px 18px;padding:13px 16px;border:1px solid var(--brass);border-radius:3px;outline:1px solid #8a6b2a44;outline-offset:3px;box-shadow:0 8px 22px #000b,inset 0 1px 0 #ffffff12,inset 0 0 30px #00000080;
background:radial-gradient(circle at 8px 8px,var(--gold) 0 2px,transparent 3px),radial-gradient(circle at calc(100% - 8px) 8px,var(--gold) 0 2px,transparent 3px),radial-gradient(circle at 8px calc(100% - 8px),var(--gold) 0 2px,transparent 3px),radial-gradient(circle at calc(100% - 8px) calc(100% - 8px),var(--gold) 0 2px,transparent 3px),linear-gradient(#2d251c,#1a1511);animation:fade .8s var(--ease) .85s backwards}
.plate b{font-family:var(--type);font-weight:400;color:var(--gold);font-size:.78rem;display:block;margin-bottom:2px}
.plate span{font-size:1.1rem;display:block}.sw8{animation:fade .5s var(--ease)}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ch h2{flex:1;margin:0;text-align:center;font-family:var(--disp);font-weight:400;font-size:1.15rem;color:var(--gold)}
.ch button,.pill2{font-family:var(--type);color:var(--tele);background:var(--smoke);border:1px solid #8a6b2a77;cursor:pointer;border-radius:2px;min-height:40px;padding:0 10px;font-size:.78rem;transition:background .25s,transform .15s}
.ch .ar{width:40px;font-size:1.4rem;padding:0;color:var(--gold)}
.ch button:active{transform:scale(.93)}
.gw{position:relative}
.pill{position:absolute;left:0;top:0;border-radius:3px;background:linear-gradient(#f0d78c,#c9a24a 50%,#a98230);box-shadow:0 6px 16px #c9a24a44;z-index:0;opacity:0;transition:transform .55s var(--spring),width .45s var(--ease),height .45s var(--ease),opacity .3s}
.cells{position:relative;z-index:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cells button{position:relative;font-family:var(--type);color:var(--tele);background:var(--smoke);border:1px solid #8a6b2a55;cursor:pointer;border-radius:3px;min-height:60px;padding:6px 0;transition:color .3s,background .3s;animation:fade .45s var(--ease) backwards;animation-delay:calc(var(--i)*28ms)}
.cells.m button{min-height:44px;padding:0}.cells.m .dw{display:none}.cells .blank{background:none;border:0;visibility:hidden}
.cells .dw{display:block;font-size:.68rem;color:var(--brass)}.cells .dn{display:block;font-family:var(--disp);font-size:1.1rem}
.cells .on{background:transparent;color:var(--coal);border-color:transparent}.cells .on .dw{color:#3a2a0e}
.cells .td{box-shadow:inset 0 0 0 2px var(--blood)}
.cells i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blood)}.cells .on i{background:var(--coal)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dayh{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--brass);padding:16px 4px 8px;margin-bottom:16px}
.dayh h2{flex:1;font-family:var(--disp);font-weight:400;margin:0;font-size:1.28rem;color:var(--gold)}
.dayh small{display:block;font-family:var(--type);font-size:.74rem;color:var(--brass);margin-top:2px}
.ring{width:40px;height:40px;flex:none}.ring circle{fill:none;stroke-width:4}.ring .bg0{stroke:#8a6b2a44}.ring .fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:101;stroke-dashoffset:101;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .8s var(--ease)}
#zone{touch-action:pan-y;min-height:240px}
.in-l{animation:inl .5s var(--ease)}.in-r{animation:inr .5s var(--ease)}
@keyframes inl{from{opacity:0;transform:translateX(36px)}}@keyframes inr{from{opacity:0;transform:translateX(-36px)}}
.sw{position:relative;margin:0 2px 16px;animation:drop .6s var(--spring) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes drop{from{opacity:0;transform:translateY(26px) scale(.96)}}
.sw.out{animation:out .3s ease-in forwards}@keyframes out{to{opacity:0;transform:translateX(-80px) scale(.9)}}
.bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px;font-family:var(--disp);opacity:0;border-radius:3px}
.bg.a{background:#27493a;justify-content:flex-start}.bg.b{background:var(--blood);justify-content:flex-end}
.slip{position:relative;display:grid;grid-template-columns:76px 1fr auto;gap:10px;color:var(--ink);padding:13px 10px 13px 24px;border-left:6px solid var(--k,var(--gold));box-shadow:0 8px 18px #000a;touch-action:pan-y;
background:radial-gradient(circle at 0 50%,var(--coal) 0 4px,transparent 5px) 0 0/12px 20px repeat-y,var(--grain),linear-gradient(#efe2bf,#e3d3a6);transition:transform .45s var(--spring);will-change:transform}
.sw:nth-child(odd) .slip{rotate:-.3deg}.sw:nth-child(even) .slip{rotate:.3deg}
.tm{font-family:var(--type);font-size:1.1rem;line-height:1.1;color:var(--blood)}.tm small{display:block;font-size:.72rem;color:var(--ink);opacity:.7}
.mid{cursor:pointer;min-width:0}
.wh{font-family:var(--type);font-size:1.05rem;line-height:1.25;word-break:break-word}.pl{font-style:italic;font-size:.95rem}.nt{font-family:var(--type);font-size:.8rem;margin-top:4px;opacity:.85}
.kd{display:inline-flex;align-items:center;gap:6px;font-family:var(--type);font-size:.68rem;border:1px solid var(--k,var(--gold));padding:0 5px;margin-bottom:3px}
.late{color:var(--blood);font-family:var(--type);font-size:.68rem;margin-left:6px;animation:blink 2s infinite}.done .late{display:none}@keyframes blink{50%{opacity:.4}}
.seal{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c04040,#6a1414);color:#f3dcb0;font-size:.8rem;box-shadow:0 1px 2px #0008,inset 0 0 0 2px #7a1c1c}
.ac{display:flex;flex-direction:column;gap:6px}.ac button{width:38px;height:38px;border:1px solid var(--ink);background:none;color:var(--ink);font-size:1rem;cursor:pointer;transition:background .2s,transform .15s}.ac button:active{transform:scale(.9);background:#2a201622}
.done .wh,.done .pl{text-decoration:line-through;opacity:.55}
.stamp{display:none;position:absolute;right:58px;top:30%;transform:rotate(-11deg);font-family:var(--type);font-size:1.15rem;color:var(--blood);border:3px double var(--blood);padding:1px 8px;opacity:.85;pointer-events:none;background:#efe2bfcc}
.done .stamp{display:block}.slam .stamp{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}.slam{animation:shake .25s .12s}
@keyframes slam{from{transform:rotate(-30deg) scale(3);opacity:0}}@keyframes shake{25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px 0}}
.empty{text-align:center;font-style:italic;color:var(--brass);padding:36px 10px;border:1px dashed #8a6b2a77;margin:0 2px;animation:fade .6s var(--ease)}
.fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));translate:-50% 0;font-family:var(--disp);font-size:1.05rem;color:var(--coal);background:linear-gradient(#f0d78c,#c9a24a 50%,#9a7628);border:1px solid #4a3410;padding:15px 28px;border-radius:40px;cursor:pointer;box-shadow:0 10px 24px #000d,inset 0 1px 0 #fbeab8;z-index:5;transition:transform .2s var(--spring);animation:rise2 .8s var(--spring) 1.1s backwards}
.fab:active{transform:scale(.94)}@keyframes rise2{from{translate:-50% 90px}}
.veil{position:fixed;inset:0;background:#000b;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--grain),var(--tele);color:var(--ink);padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(106%);transition:transform .5s var(--spring);z-index:9;border-top:6px double var(--blood);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0}
.open .veil{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:56px;height:22px;margin:0 auto 4px;cursor:grab;touch-action:none;display:grid;place-items:center}.grab::after{content:"";width:44px;height:4px;border-radius:2px;background:var(--ink);opacity:.35}
.sheet h3{font-family:var(--disp);font-weight:400;margin:0 0 10px;font-size:1.3rem}
.sheet label{display:block;font-family:var(--type);font-size:.78rem;margin-bottom:10px}
.sheet input:not([type=checkbox]),.sheet select,.sheet textarea{display:block;width:100%;margin-top:3px;font-family:var(--type);font-size:1rem;color:var(--ink);background:#f7eed3;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:9px 6px;transition:background .2s,border-color .2s}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{background:#fff6da;border-color:var(--blood)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk{display:flex!important;align-items:center;gap:8px}.chk input{width:20px;height:20px;accent-color:var(--blood)}
.btns{display:flex;gap:10px;margin-top:6px}.btns button{flex:1;font-family:var(--disp);font-size:1rem;padding:13px;cursor:pointer;border:2px solid var(--ink);background:none;color:var(--ink);transition:transform .15s}.btns button:active{transform:scale(.96)}.btns .ok{background:var(--blood);color:var(--tele);border-color:var(--blood)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));translate:-50% 30px;opacity:0;pointer-events:none;background:#2d251c;border:1px solid var(--gold);padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:7;font-size:.95rem;transition:all .4s var(--spring);white-space:nowrap}
.toast.on{translate:-50% 0;opacity:1;pointer-events:auto}.toast button{background:none;border:0;color:var(--gold);font-family:var(--disp);cursor:pointer;font-size:.95rem}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<svg class="crest" viewBox="0 0 400 110" aria-hidden="true"><path class="a" style="--n:0" d="M40 108h320"/><path class="a" style="--n:2" d="M80 108a120 120 0 0 1 240 0"/><path class="a" style="--n:4" d="M110 108a90 90 0 0 1 180 0"/><g id="rays"></g><path class="sun" d="M166 108a34 34 0 0 1 68 0z"/></svg>
<h1>The Day Book</h1>
<p class="tag">Business &amp; engagements &mdash; London, 1926</p>
<div class="plate"><b>NEXT ON THE LIST</b><span id="next">&hellip;</span></div>
<div class="ch"><button class="ar" id="pv" aria-label="Previous">&#8249;</button><h2 id="ttl"></h2><button id="tdy">Today</button><button id="mode">Month</button><button class="ar" id="nx" aria-label="Next">&#8250;</button></div>
<div class="gw"><div class="pill" id="pill"></div><div class="cells" id="cells"></div></div>
<div id="zone"><div class="dayh"><h2 id="dh"></h2><svg class="ring" viewBox="0 0 36 36"><circle class="bg0" cx="18" cy="18" r="16"/><circle class="fg" id="fg" cx="18" cy="18" r="16" pathLength="101"/></svg><div id="tally" style="font-family:var(--type);font-size:.78rem;color:var(--brass);min-width:70px;text-align:right"></div></div><div id="list"></div></div>
</div>
<button class="fab" id="add">+ New entry</button>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>
<div id="ov"><div class="veil" id="veil"></div>
<form class="sheet" id="f" role="dialog" aria-label="Entry" autocomplete="off">
<div class="grab" id="grab"></div><h3 id="sh3">New entry</h3>
<label>Business to attend<input id="title" required maxlength="80" placeholder="Meeting with Mr. Solomons"></label>
<div class="two"><label>Date<input id="date" type="date" required></label><label>Hour<input id="time" type="time" required value="10:00"></label></div>
<div class="two"><label>Kind<select id="kind"><option>Business</option><option>Payment due</option><option>Dinner</option><option>Personal</option><option>Errand</option></select></label><label>Place<input id="place" maxlength="60" placeholder="The Garrison"></label></div>
<div class="two"><label id="replab">Repeat<select id="rep"><option value="">Once only</option><option value="d">Daily, 7 days</option><option value="w">Weekly, 8 weeks</option></select></label><label class="chk"><input type="checkbox" id="urg"> Urgent (wax seal)</label></div>
<label>Notes<textarea id="note" rows="2" maxlength="200" placeholder="Come alone."></textarea></label>
<div class="btns"><button type="button" id="cancel">Cancel</button><button class="ok" type="submit" id="okb">Enter in book</button></div>
</form></div>
<script>
(function(){
var KEY='ledger1920',E=[],sel=iso(new Date()),mode='week',editId=null,last=null,tmr,lastKey='';
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var COL={'Business':'#c9a24a','Payment due':'#8a2424','Dinner':'#27493a','Personal':'#5a4a7a','Errand':'#8a6b2a'};
function $(i){return document.getElementById(i)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function P(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,n){var d=P(s);return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function clock(t){var p=t.split(':'),h=+p[0];return (h%12||12)+':'+p[1]+'<small>'+(h<12?'am':'pm')+'</small>'}
function clk(t){return clock(t).replace(/<[^>]+>/g,' ')}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function hap(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
try{E=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){E=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(E))}catch(e){}}
function dayList(k){return E.filter(function(e){return e.date===k}).sort(function(a,b){return a.time<b.time?-1:1})}

var r='';for(var i=1;i<12;i++){var a=Math.PI*(1-i/12),c=Math.cos(a),n=Math.sin(a);r+='<line class="r" style="--n:'+(i+3)+'" x1="'+(200+36*c).toFixed(1)+'" y1="'+(108-36*n).toFixed(1)+'" x2="'+(200+120*c).toFixed(1)+'" y2="'+(108-120*n).toFixed(1)+'"/>'}
$('rays').innerHTML=r;

function nextUp(){var n=new Date(),k=iso(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes()),t;
var L=E.filter(function(e){return !e.done&&(e.date+' '+e.time)>=k}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1});
if(!L.length)t='Nothing pending. A quiet spell.';
else{var e=L[0],m=Math.round((new Date(+e.date.slice(0,4),+e.date.slice(5,7)-1,+e.date.slice(8,10),+e.time.slice(0,2),+e.time.slice(3,5))-n)/6e4),w;
if(m<60)w='in '+m+' min';else if(m<1440)w='in '+Math.floor(m/60)+' h '+(m%60)+' min';else w=DAY[P(e.date).getDay()]+' at '+clk(e.time);t=e.title+' \u2014 '+w}
var s=$('next');if(s.textContent!==t){s.textContent=t;s.classList.remove('sw8');void s.offsetWidth;s.classList.add('sw8')}}

function placePill(){var b=$('cells').querySelector('.on'),p=$('pill');if(!b){p.style.opacity=0;return}
var cr=$('cells').getBoundingClientRect(),br=b.getBoundingClientRect();p.style.opacity=1;p.style.width=br.width+'px';p.style.height=br.height+'px';p.style.transform='translate('+(br.left-cr.left)+'px,'+(br.top-cr.top)+'px)'}
function renderCells(){var d=P(sel),td=iso(new Date()),h='',days=[],key;
if(mode==='week'){var ws=addD(sel,-((d.getDay()+6)%7));for(var i=0;i<7;i++)days.push(addD(ws,i));key='w'+ws}
else{var f=new Date(d.getFullYear(),d.getMonth(),1),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();for(var j=0;j<(f.getDay()+6)%7;j++)days.push(null);for(var q=1;q<=n;q++)days.push(iso(new Date(d.getFullYear(),d.getMonth(),q)));key='m'+d.getFullYear()+d.getMonth()}
var anim=key!==lastKey;lastKey=key;
days.forEach(function(k,i){if(!k){h+='<button class="blank" tabindex="-1" aria-hidden="true"></button>';return}var x=P(k),c=dayList(k).length;
h+='<button data-d="'+k+'" style="--i:'+(anim?i:0)+';'+(anim?'':'animation:none')+'" class="'+(k===sel?'on ':'')+(k===td?'td':'')+'" aria-label="'+DAY[x.getDay()]+' '+ord(x.getDate())+'"><span class="dw">'+DAY[x.getDay()].slice(0,3)+'</span><span class="dn">'+x.getDate()+'</span>'+(c?'<i></i>':'')+'</button>'});
$('cells').className='cells'+(mode==='month'?' m':'');$('cells').innerHTML=h;$('ttl').textContent=MON[d.getMonth()]+' '+d.getFullYear();$('mode').textContent=mode==='week'?'Month':'Week';
requestAnimationFrame(placePill)}

function slip(e,i,now){var late=!e.done&&(e.date<now.d||(e.date===now.d&&e.time<now.t));
return '<div class="sw" data-id="'+e.id+'" style="--i:'+i+'"><div class="bg a">&#10003; Attended</div><div class="bg b">Strike out &#10005;</div><div class="slip'+(e.done?' done':'')+'" style="--k:'+(COL[e.kind]||'#c9a24a')+'"><div class="tm">'+clock(e.time)+'</div><div class="mid" data-edit="'+e.id+'"><span class="kd">'+esc(e.kind)+(e.urgent?'<span class="seal">!</span>':'')+'</span>'+(late?'<span class="late">OVERDUE</span>':'')+'<div class="wh">'+esc(e.title)+'</div>'+(e.place?'<div class="pl">at '+esc(e.place)+'</div>':'')+(e.note?'<div class="nt">'+esc(e.note)+'</div>':'')+'</div><div class="ac"><button data-ok="'+e.id+'" aria-label="Mark attended">&#10003;</button><button data-x="'+e.id+'" aria-label="Strike out">&#10005;</button></div><div class="stamp">ATTENDED</div></div></div>'}
function stats(){var L=dayList(sel),o=L.filter(function(e){return e.done}).length;$('tally').textContent=L.length?o+' of '+L.length+' attended':'';$('fg').style.strokeDashoffset=101*(1-(L.length?o/L.length:0));nextUp()}
function renderDay(dir){var d=P(sel),n=new Date(),now={d:iso(n),t:pad(n.getHours())+':'+pad(n.getMinutes())},L=dayList(sel);
$('dh').innerHTML=DAY[d.getDay()]+'<small>'+ord(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear()+'</small>';
$('list').innerHTML=L.length?L.map(function(e,i){return slip(e,i,now)}).join(''):'<div class="empty">Nothing written for this day.<br>Tap &ldquo;New entry&rdquo; to add business.</div>';
var z=$('zone');z.classList.remove('in-l','in-r');if(dir){void z.offsetWidth;z.classList.add(dir>0?'in-l':'in-r')}stats()}
function render(dir){renderCells();renderDay(dir)}
function go(k,force){if(k===sel&&!force)return;var dir=k>sel?1:-1;sel=k;render(dir)}
function shift(n){var d=P(sel);if(mode==='week')go(addD(sel,7*n));else{var m=new Date(d.getFullYear(),d.getMonth()+n,1),dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();go(iso(new Date(m.getFullYear(),m.getMonth(),Math.min(d.getDate(),dim))))}}
$('pv').onclick=function(){shift(-1)};$('nx').onclick=function(){shift(1)};$('tdy').onclick=function(){go(iso(new Date()))};
$('mode').onclick=function(){mode=mode==='week'?'month':'week';renderCells()};
$('cells').onclick=function(e){var b=e.target.closest('button[data-d]');if(b){go(b.dataset.d);hap()}};
window.addEventListener('resize',placePill);

/* actions */
function toggle(id){var e=E.filter(function(x){return x.id==id})[0];if(!e)return;e.done=!e.done;save();var s=$('list').querySelector('[data-id="'+id+'"] .slip');if(s){s.classList.toggle('done',e.done);s.classList.remove('slam');if(e.done){void s.offsetWidth;s.classList.add('slam')}}stats();hap()}
function strike(id){var s=$('list').querySelector('[data-id="'+id+'"]');var e=E.filter(function(x){return x.id==id})[0];if(!e)return;if(s)s.classList.add('out');
setTimeout(function(){last=e;E=E.filter(function(x){return x!==e});save();render();toast('Entry struck out')},300)}
function toast(m){$('tmsg').textContent=m;$('toast').classList.add('on');clearTimeout(tmr);tmr=setTimeout(function(){$('toast').classList.remove('on')},5000)}
$('undo').onclick=function(){if(last){E.push(last);last=null;save();render()}$('toast').classList.remove('on')};
$('list').onclick=function(e){var b=e.target.closest('button'),m=e.target.closest('[data-edit]');
if(b&&b.dataset.ok)toggle(b.dataset.ok);else if(b&&b.dataset.x)strike(b.dataset.x);else if(m)openSheet(m.dataset.edit)};

/* swipe a slip: right = attended, left = strike out */
var sw=null;
$('list').addEventListener('pointerdown',function(e){var s=e.target.closest('.slip');if(!s||e.target.closest('button'))return;sw={s:s,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,dx:0}});
$('list').addEventListener('pointermove',function(e){if(!sw||e.pointerId!==sw.id)return;var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
if(!sw.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){sw.on=true;sw.s.style.transition='none';try{$('list').setPointerCapture(e.pointerId)}catch(_){}}else return}
sw.dx=dx;var p=sw.s.parentNode,o=Math.min(1,Math.abs(dx)/100);p.querySelector('.a').style.opacity=dx>0?o:0;p.querySelector('.b').style.opacity=dx<0?o:0;sw.s.style.transform='translateX('+dx+'px) rotate('+dx/30+'deg)'});
function swUp(e){if(!sw||e.pointerId!==sw.id)return;var w=sw;sw=null;if(!w.on)return;var p=w.s.parentNode,id=p.dataset.id;w.s.style.transition='';w.s.style.transform='';p.querySelector('.a').style.opacity=0;p.querySelector('.b').style.opacity=0;
if(e.type==='pointerup'){if(w.dx>100)toggle(id);else if(w.dx<-100)strike(id)}}
$('list').addEventListener('pointerup',swUp);$('list').addEventListener('pointercancel',swUp);

/* swipe the day */
var dx0,dy0;$('zone').addEventListener('pointerdown',function(e){dx0=e.target.closest('.slip')?null:e.clientX;dy0=e.clientY});
$('zone').addEventListener('pointerup',function(e){if(dx0==null)return;var dx=e.clientX-dx0,dy=e.clientY-dy0;dx0=null;if(Math.abs(dx)>70&&Math.abs(dy)<50)go(addD(sel,dx<0?1:-1))});

/* sheet */
function open(v){$('ov').className=v?'open':''}
function openSheet(id){editId=id||null;var e=id?E.filter(function(x){return x.id==id})[0]:null;
$('sh3').textContent=e?'Amend entry':'New entry';$('okb').textContent=e?'Save amendment':'Enter in book';$('replab').style.display=e?'none':'block';
$('title').value=e?e.title:'';$('date').value=e?e.date:sel;$('time').value=e?e.time:'10:00';$('kind').value=e?e.kind:'Business';$('place').value=e?e.place:'';$('note').value=e?e.note:'';$('urg').checked=e?!!e.urgent:false;$('rep').value='';
open(true);if(!e)setTimeout(function(){$('title').focus()},420)}
$('add').onclick=function(){openSheet()};$('veil').onclick=$('cancel').onclick=function(){open(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape')open(false)});
$('f').onsubmit=function(ev){ev.preventDefault();var v={date:$('date').value,time:$('time').value,title:$('title').value.trim(),place:$('place').value.trim(),kind:$('kind').value,note:$('note').value.trim(),urgent:$('urg').checked};
if(editId){E.forEach(function(x){if(x.id==editId)for(var k in v)x[k]=v[k]})}
else{var rp=$('rep').value,n=rp==='d'?7:rp==='w'?8:1,st=rp==='d'?1:7;for(var i=0;i<n;i++){var c={};for(var k in v)c[k]=v[k];c.date=addD(v.date,i*st);c.id=Date.now()+i;c.done=false;E.push(c)}}
save();open(false);hap();go(v.date,true)};
var g=null;$('grab').addEventListener('pointerdown',function(e){g={y:e.clientY,id:e.pointerId,d:0};$('f').style.transition='none';try{$('grab').setPointerCapture(e.pointerId)}catch(_){}});
$('grab').addEventListener('pointermove',function(e){if(!g||e.pointerId!==g.id)return;g.d=Math.max(0,e.clientY-g.y);$('f').style.transform='translateY('+g.d+'px)'});
function gu(){if(!g)return;var d=g.d;g=null;$('f').style.transition='';$('f').style.transform='';if(d>110)open(false)}
$('grab').addEventListener('pointerup',gu);$('grab').addEventListener('pointercancel',gu);

render();setInterval(nextUp,30000);
})();
</script>
</body>
</html>
